# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ailse-legal-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://ailse:ailse@db:5432/ailse
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/logs:/app/logs
      - ./Backend/cases_metadata.db:/app/cases_metadata.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: python -m uvicorn model.api:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: paradedb/paradedb:latest
    container_name: ailse-db
    environment:
      - POSTGRES_USER=ailse
      - POSTGRES_PASSWORD=ailse
      - POSTGRES_DB=ailse
    ports:
      - "5432:5432"
    volumes:
      - ailse_pgdata:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ailse_pgdata: