name: Continuous Integration

on:
  push:
    branches: [ master ]
    paths:
      - 'Backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, prod ]
    paths:
      - 'Backend/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install test dependencies (no torch needed: tests use fakes)
      run: pip install fastapi uvicorn pydantic psycopg2-binary httpx pytest

    - name: Check Python syntax
      working-directory: Backend
      run: python -m py_compile model/*.py citations_mining.py

    - name: Unit tests (no database, no network, no GPU)
      working-directory: Backend
      run: python -m pytest test -q

    - name: Validate Docker build
      run: |
        cd Backend
        docker build -t kanoon-backend-validate .
        docker rmi kanoon-backend-validate
