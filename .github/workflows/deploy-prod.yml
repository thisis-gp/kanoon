# =====================================================================================
# LEGACY AND DISABLED. DO NOT RE-ENABLE.
# This workflow deployed the old Qdrant backend to AWS App Runner with long-lived AWS access
# keys. The project now runs on the VM stack (docker-compose.vm.yml, docs/DEPLOY-VM.md), so
# it only runs when started by hand (workflow_dispatch) and it no longer triggers on push or
# pull request. If AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GROQ_API_KEY,
# QDRANT_CLOUD_URL or QDRANT_CLOUD_API_KEY ever existed as GitHub secrets, rotate them and
# delete them: see docs/SECURITY.md. Kept only as a reference for the old deployment.
# =====================================================================================
name: Deploy to AWS (legacy, disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kanoon-backend
  ECR_REGISTRY: 654654525844.dkr.ecr.us-east-1.amazonaws.com
  APP_RUNNER_SERVICE: kanoon-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2.0.1
      
    - name: Clean up Docker environment
      run: |
        echo "🧹 Cleaning up Docker environment before build..."
        docker system prune -af
        docker volume prune -f
        echo "✅ Docker environment cleaned"

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build and push Backend image
        cd Backend
        
        # Build image with fresh base
        docker build \
          --no-cache \
          --pull \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
        
        # Push both tags
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Update App Runner Service
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Get the App Runner service ARN
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" --output text)
        
        if [ -z "$SERVICE_ARN" ]; then
          echo "App Runner service not found: $APP_RUNNER_SERVICE"
          exit 1
        fi
        
        echo "Updating App Runner service: $SERVICE_ARN"
        echo "Using image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        
        # Update the service configuration first
        aws apprunner update-service \
          --service-arn $SERVICE_ARN \
          --source-configuration '{
            "ImageRepository": {
              "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'",
              "ImageConfiguration": {
                "Port": "8000",
                "RuntimeEnvironmentVariables": {
                  "GROQ_API_KEY": "'${{ secrets.GROQ_API_KEY }}'",
                  "QDRANT_CLOUD_URL": "'${{ secrets.QDRANT_CLOUD_URL }}'",
                  "QDRANT_CLOUD_API_KEY": "'${{ secrets.QDRANT_CLOUD_API_KEY }}'",
                  "HOST": "0.0.0.0",
                  "PORT": "8000",
                  "ENVIRONMENT": "production"
                }
              },
              "ImageRepositoryType": "ECR"
            }
          }'
        
        # Wait for service to be ready (polling approach)
        echo "Waiting for service update to complete..."
        while true; do
          STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
          echo "Service status: $STATUS"
          if [ "$STATUS" = "RUNNING" ]; then
            echo "Service is ready!"
            break
          elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
            echo "Service update failed with status: $STATUS"
            exit 1
          fi
          echo "Waiting 30 seconds before checking again..."
          sleep 30
        done
        
        # Start deployment
        echo "Starting deployment..."
        aws apprunner start-deployment --service-arn $SERVICE_ARN
          
    - name: Wait for deployment to complete
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" --output text)
        
        echo "Waiting for deployment to complete..."
        # Poll deployment status
        while true; do
          STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
          echo "Service status: $STATUS"
          if [ "$STATUS" = "RUNNING" ]; then
            echo "Deployment completed successfully!"
            break
          elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
          echo "Waiting 30 seconds before checking again..."
          sleep 30
        done
        
        # Get final service status
        FINAL_STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
        echo "Final service status: $FINAL_STATUS"
        
    - name: Deployment Summary
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" --output text)
        SERVICE_URL=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.ServiceUrl" --output text)
        
        echo "🚀 Deployment completed!"
        echo "Service URL: $SERVICE_URL"
        echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo ""
        echo "📋 Next Steps:"
        echo "1. Test your API endpoints"
        echo "2. Check App Runner logs if needed"
        echo "3. Update frontend to use new backend URL if changed"
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up runner storage..."
        docker system prune -af
        docker volume prune -f
        echo "✅ Cleanup completed"
